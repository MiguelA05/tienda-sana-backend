# Main server port (Render injects PORT)
server.port=${PORT:8080}

# Load local .env when running outside cloud environments.
spring.config.import=optional:file:.env[.properties]

# Mail
simplejavamail.smtp.host=${SMTP_HOST:smtp.gmail.com}
simplejavamail.smtp.port=${SMTP_PORT:587}
simplejavamail.smtp.username=${SMTP_USERNAME:}
simplejavamail.smtp.password=${SMTP_PASSWORD:}
simplejavamail.smtp.transport.strategy=${SMTP_TRANSPORT_STRATEGY:SMTP_TLS}
spring.mail.properties.mail.smtp.auth=true
simplejavamail.debug=${SIMPLEJAVAMAIL_DEBUG:false}

# Swagger / actuator
springdoc.use-management-port=false
management.server.port=${PORT:8080}
logging.level.org.springframework.boot.context.properties.bind=TRACE

# Exponer endpoints de actuator incluyendo prometheus
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.security.enabled=false

# Configure metrics
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

# Application name
spring.application.name=tienda-sana

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tienda_sana}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# CORS (comma-separated origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# IA - DeepSeek
deepseek.enabled=${DEEPSEEK_ENABLED:true}
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
deepseek.timeout-ms=${DEEPSEEK_TIMEOUT_MS:12000}

# Para Tomcat (por defecto)
server.tomcat.threads.max=50
# si tus operaciones son lentas (p. ej. consultas pesadas a MongoDB).
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=20
# A lower value fails faster under heavy load,
# lo cual puede ser preferible a que muchas solicitudes esperen indefinidamente
# y consuman recursos del lado del cliente y del servidor.

#Reservas
reservas.pending-hold-minutes=15

# Inventario ledger: migrar lotes existentes a transacciones al arrancar (solo si la colección está vacía)
tiendasana.inventory.migration.run-on-startup=${TIENDASANA_INVENTORY_MIGRATION:false}

# Mercado Pago
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.frontend-base-url=${MERCADOPAGO_FRONTEND_BASE_URL:http://localhost:4200}
mercadopago.webhook-base-url=${MERCADOPAGO_WEBHOOK_BASE_URL:http://localhost:8080}